name: 🚀 Release Please

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to target for release'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          target-branch: ${{ inputs.target_branch || github.ref_name }}
